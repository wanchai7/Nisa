<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery | Nisa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">NISA.</a>
        <button class="menu-toggle" aria-label="Toggle navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#slider">Gallery</a>
            <a href="image.html">Image</a>
            <a href="index.html#Contact">Contact</a>
        </div>
    </nav>

    <div class="decor-shape shape-1"></div>
    <div class="decor-shape shape-2"></div>
    <div class="decor-shape shape-3"></div>
    <div class="decor-shape shape-4"></div>

    <div class="card" id="slider">
        <h1 class="title">Image Gallery</h1>
        <p class="subtitle highlight">สมัยพี่เฟี้ยวๆเลยนะเนี่ย สวยหวานสดใสจนหยุดมองไม่ได้</p>

        <div class="slider-wrap">
            <button class="arrow-outside left" aria-label="Previous">‹</button>
            <div class="slider" aria-label="Image slider">
                <div class="slides">
                    <img src="yanisa1.png" class="slide" alt="Yanisa 1">
                    <img src="yanisa2.png" class="slide" alt="Yanisa 2">
                    <img src="yanisa3.png" class="slide" alt="Yanisa 3">
                    <img src="yanisa4.png" class="slide" alt="Yanisa 4">
                    <img src="yanisa5.png" class="slide" alt="Yanisa 5">
                    <img src="yanisa6.png" class="slide" alt="Yanisa 6">
                    <img src="yanisa7.png" class="slide" alt="Yanisa 7">
                </div>
            </div>
            <button class="arrow-outside right" aria-label="Next">›</button>
        </div>

        <div class="actions">
            <button onclick="window.location.href='index.html'" class="button button-blue">กลับหน้าหลัก</button>
            <a href="index.html#Contact" class="button button-pink" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">ติดต่อ</a>
        </div>

        <div class="message">
            <p>เลื่อนดูรูปทั้งหมดได้ด้วยปุ่มซ้าย-ขวา หรือรอสไลด์อัตโนมัติ</p>
        </div>
    </div>

    <footer class="footer" id="Contact">
        <div class="footer-container">
            <!-- 1. Brand -->
            <div class="footer-col footer-brand-col">
                <a href="#" class="footer-brand">NISA</a>
            </div>

            <!-- 2. Links & Copyright -->
            <div class="footer-col footer-info-col">
                <div class="footer-links">
                    <a href="index.html">Home</a>
                    <a href="index.html#News">News</a>
                    <a href="image.html">Images</a>
                    <a href="index.html#Contact">Contact Us</a>
                </div>
                <div class="footer-bottom">
                    <span>Copyright ©2026 Designed by ผู้จัดทำ</span>
                </div>
            </div>

            <!-- 3. Social -->
            <div class="footer-col footer-social-col">
                <div class="footer-social">
                    <a href="https://web.facebook.com/yanisa.somtua.9" class="footer-icon fb-icon" aria-label="Facebook"><span class="fi-icon">F</span><span class="fi-label">Facebook</span></a>
                    <a href="https://www.instagram.com/p.cyaaa" class="footer-icon ig-icon" aria-label="Instagram"><span class="fi-icon">I</span><span class="fi-label">Instagram</span></a>
                </div>
            </div>

            <!-- 4. Developer Badge -->
            <div class="footer-col footer-badge-col">
                <div class="footer-badge">
                    <img src="view.png" alt="ผู้จัดทำ" />
                    <span>Developer</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="main.js" defer></script>
</body>
</html>
